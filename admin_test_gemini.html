<style>
:root{--bg:#eef3ef;--sf:#fff;--tx:#17251e;--mu:#58685f;--ac:#17694a;--ac2:#e1f0e8;--bd:#d3ddd6;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--sf:#1b2621;--tx:#e8efe9;--mu:#9bb0a4;--ac:#5fc79a;--ac2:#22372d;--bd:#33463c;--rd:#ff8a80}}

html,body{margin:0;font-size:16px;background:var(--bg);color:var(--tx);font-family:'Noto Sans Malayalam',system-ui,sans-serif;line-height:1.6}
body{padding:0 12px 40px;max-width:900px;margin:auto}
h1{font-size:21px;margin:0 -12px 8px;padding:18px 16px 16px;background:var(--ac);color:var(--bg);border-radius:0 0 22px 22px}h2{font-size:18px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border-radius:999px;padding:10px 16px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--sf);padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:600;min-height:44px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:4px 9px;font-size:13px;min-height:34px}
a.wa-btn{display:inline-block;text-decoration:none;background:#1f7a4c;color:#fff;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);min-height:44px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 6px;font-size:16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row b{min-width:38px;text-align:center;padding:5px 0;border-radius:10px;background:var(--ac2);color:var(--ac)}.row.ab b{background:var(--rd);color:#fff}
.row.ab{color:var(--rd);font-weight:600;background:rgba(179,38,30,.08);border-radius:10px}
.mu{color:var(--mu);font-size:13px}.warn{color:var(--rd)}
.stat{display:flex;gap:8px;flex-wrap:wrap}.stat div{flex:1;min-width:90px;background:var(--ac2);padding:8px;border-radius:8px}.stat b{font-size:22px;display:block}
.scroll{overflow-x:auto}
table.reg-tbl{border-collapse:collapse;font-size:10px;width:100%;table-layout:auto}
table.reg-tbl th,table.reg-tbl td{border:1px solid #333;padding:3px 3px;text-align:center;vertical-align:middle;white-space:normal!important;word-break:break-word!important;overflow-wrap:break-word!important;overflow:visible!important;height:auto;line-height:1.25}
table.reg-tbl th.sn,table.reg-tbl td.sn{width:22px;min-width:20px;max-width:26px;padding:2px 1px}
table.reg-tbl td.wrap-col{max-width:95px;min-width:65px}
.sig-cell{padding:2px 1px!important;vertical-align:middle!important;height:30px}

#print{display:none}

  #pdf_stage{display:none!important}
  html,body{padding:0!important;margin:0!important;max-width:none!important;background:#fff}

  #print{display:block;color:#000;background:#fff;width:100%;box-sizing:border-box}
  #print.p-portrait table.reg-tbl{width:100%!important;font-size:10px}

  #print.p-landscape td,#print.p-landscape th{white-space:normal!important;word-break:break-word!important;overflow-wrap:break-word!important;overflow:visible!important;padding:2px 2px;height:auto}
  #print.p-landscape .sig-tilt{transform:rotate(-16deg);font-size:7px}
  #print.p-landscape .sig-tilt img{height:14px;max-width:30px}
  .tc-page-break{page-break-after:always;break-after:page}
}
</style></head><body>
<h1 id="ttl">മദ്രസ മാനേജർ – അഡ്മിൻ (Gemini Phase 2)</h1>
<div style="background:#b3261e;color:#fff;padding:10px 14px;border-radius:12px;margin:8px 0;font-weight:600">⚠ ഡ്യൂപ്ലിക്കേഷൻ ടെസ്റ്റ് പാനൽ (Gemini) – ഇതിൽ "എല്ലാ ഡാറ്റയും മായ്ക്കുക" ഉണ്ട്. ഇത് യഥാർത്ഥ Sheet-നെയും ബാധിക്കും.</div>
<div class="mu" id="sv"></div>
<div id="gate" class="card"><b>🔒 അഡ്മിൻ പ്രവേശനം</b><label>PIN / പാസ്‌വേഡ്<input id="pin" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><p><button class="pri" onclick="login()">പ്രവേശിക്കുക</button></p></div>
<div id="app" style="display:none"></div>
<div id="print"></div>
<div id="pdf_stage"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxBzUzcsGppeWVO87RiHysygaAz-bCnf6r8JgKDGyw0zgvx1jnSnPOe404qK0YEFRpZVg/exec';
const $=s=>document.querySelector(s);
async function api(action,data){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,...data})});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j.data}
const MONTHS=['ജനുവരി','ഫെബ്രുവരി','മാർച്ച്','ഏപ്രിൽ','മേയ്','ജൂൺ','ജൂലൈ','ഓഗസ്റ്റ്','സെപ്റ്റംബർ','ഒക്ടോബർ','നവംബർ','ഡിസംബർ'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date());

// എല്ലാ സ്ഥലത്തും DD-MM-YYYY ഫോർമാറ്റിൽ തീയതി കാണിക്കാൻ
const fmtD=d=>{
  if(!d)return'';
  const s=String(d).trim();
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  return m?`${m[3]}-${m[2]}-${m[1]}`:s;
};
const D=fmtD;

const f=(id,l,t='text',v='')=>`<label>${l}<input id="${id}" type="${t}" value="${v}"></label>`;
const val=id=>$('#'+id).value.trim();
const opts=(arr,cur)=>arr.map(c=>`<option value="${c.id}" ${c.id==cur?'selected':''}>${c.name}</option>`).join('');
const cls=id=>db.classes.find(c=>c.id==id)||{name:'-'};
const stuIn=c=>db.students.filter(s=>s.classId==c&&!s.left).sort((a,b)=>a.no-b.no);
const esc=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function waLink(phone, text){
  const digits=String(phone||'').replace(/\D/g,'');
  if(!digits)return'';
  const num=digits.length===10?'91'+digits:digits;
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(text||'');
}
function waBtn(phone, label, msg){
  const href=waLink(phone,msg);
  if(!href)return'<span class="mu">ഫോൺ ഇല്ല</span>';
  return `<a class="wa-btn" target="_blank" rel="noopener" href="${href}">${esc(label||'💬 വാട്സ്ആപ്പ്')}</a>`;
}

function tabs(list){return`<div class="tabs">`+list.map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';go()">${v}</button>`).join('')+`</div>`}
function pending(c){const days=Object.keys(db.att).filter(k=>k.startsWith(c+'|')).map(k=>k.split('|')[1]).sort();if(!days.length)return[];
const out=[];let d=new Date(days[days.length-1]+'T00:00');d.setDate(d.getDate()+1);while(iso(d)<today){if(d.getDay()!=0)out.push(iso(d));d.setDate(d.getDate()+1)}return out}

function sgn(a){
  if(!a)return'';
  if(a.holiday)return `<span class="sig-tilt">${esc(a.holiday)}</span>`;
  const t=db.teachers.find(x=>x.id==a.by)||{};
  if(t.sig)return `<span class="sig-tilt"><img src="${t.sig}" alt=""></span>`;
  return `<span class="sig-tilt">${esc((t.name||'').slice(0,6))}</span>`;
}

function makeSigPad(canvasId, initialData, onChange){
  const c=$('#'+canvasId); if(!c)return;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.strokeStyle='#111111';
  if(initialData){
    const im=new Image();
    im.onload=()=>{ctx.drawImage(im,0,0,c.width,c.height);if(onChange)onChange(c.toDataURL('image/jpeg',0.75))};
    im.src=initialData;
  }
  let dr=false;
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*(c.width/r.width),(e.clientY-r.top)*(c.height/r.height)]};
  c.onpointerdown=e=>{dr=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!dr)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
  c.onpointerup=()=>{if(!dr)return;dr=false;if(onChange)onChange(c.toDataURL('image/jpeg',0.75))};
}

let sigData='';
function initSig(d){sigData=d||'';makeSigPad('sgc',d,v=>sigData=v)}
function clrSig(){sigData='';makeSigPad('sgc','',v=>sigData=v)}

let PIN='',db={madrasa:'',mno:'',next:1,yearStart:'',vacationStart:'',sadarId:'',classes:[],teachers:[],students:[],apps:[],att:{}};
let tab='dash';
const sel={
  cls:null,date:today,
  from:today.slice(0,8)+'01',
  to:iso(new Date(+today.slice(0,4),+today.slice(5,7),0)),
  all:true,tcCls:null,tcStu:null,appSig:{},
  stuQ:'',stuClsFilter:'',callCls:'',bonStu:null,trimBefore:''
};
const st=t=>{$('#sv').textContent=t};
let saving=Promise.resolve();

function save(){
  const p={
    pin:PIN,
    data:{
      settings:{
        madrasa:db.madrasa,
        mno:db.mno,
        next:db.next,
        yearStart:db.yearStart||'',
        vacationStart:db.vacationStart||'',
        sadarId:db.sadarId||''
      },
      classes:db.classes,
      teachers:db.teachers,
      students:db.students
    }
  };
  st('സേവ് ചെയ്യുന്നു…');
  saving=saving.then(()=>api('adminSave',p)).then(()=>st('✓ Google Sheet-ൽ സേവ് ചെയ്തു')).catch(e=>{st('⚠ സേവ് പരാജയം');alert('Sheet-ലേക്ക് സേവ് ചെയ്യാനായില്ല: '+e.message)})
}
function delApp(id){api('delApp',{pin:PIN,id}).catch(e=>alert(e.message))}

async function login(p){
  p=p||$('#pin').value.trim();if(!p)return;st('ലോഡ് ചെയ്യുന്നു…');
  try{Object.assign(db,await api('adminLoad',{pin:p}));PIN=p;sessionStorage.setItem('madrasa_pin',p)}
  catch(e){sessionStorage.removeItem('madrasa_pin');st('');return alert(e.message)}
  if(!db.classes.length&&!db.students.length&&!db.teachers.length){
    db.classes=[{id:'c1',name:'ക്ലാസ് 1',sess:'1',teacher:''},{id:'c2',name:'ക്ലാസ് 2',sess:'2',teacher:''}];
    save();
  }
  if(!db.classes.find(c=>c.id==sel.cls))sel.cls=db.classes[0]?.id;
  if(!db.classes.find(c=>c.id==sel.tcCls))sel.tcCls=db.classes[0]?.id;
  if(!sel.callCls)sel.callCls=db.classes[0]?.id||'';
  $('#gate').style.display='none';$('#app').style.display='';
  if(db.madrasa)$('#ttl').textContent=db.madrasa+' (Gemini Phase 2)';
  st('');go();
}
const reload=()=>saving.then(()=>login(PIN));
function logout(){sessionStorage.removeItem('madrasa_pin');location.reload()}
function go(){admin_()}

async function clearAll(){
  if(prompt('Sheet-ലെ എല്ലാ ഡാറ്റയും മായ്ക്കും (മുമ്പ് Drive-ൽ ബാക്കപ്പ് എടുക്കും). തുടരാൻ CLEAR എന്ന് ടൈപ്പ് ചെയ്യുക')!=='CLEAR')return;
  st('മായ്ക്കുന്നു…');
  try{const n=await api('clearAll',{pin:PIN,confirm:'CLEAR'});alert('എല്ലാം മായ്ച്ചു. ബാക്കപ്പ് Drive-ൽ: '+n);location.reload()}
  catch(e){st('');alert('പരാജയം: '+e.message)}
}
async function chPin(){const n=prompt('പുതിയ PIN (4–32 അക്ഷരം)');if(!n)return;try{await api('setPin',{pin:PIN,newPin:n});PIN=n;sessionStorage.setItem('madrasa_pin',n);alert('PIN മാറ്റി')}catch(e){alert(e.message)}}
async function driveBk(){st('Drive-ലേക്ക് ബാക്കപ്പ് എടുക്കുന്നു…');try{const n=await api('driveBackup',{pin:PIN});st('✓ '+n);alert('Google Drive › Madrasa_Backups › Backups ഫോൾഡറിൽ സേവ് ചെയ്തു:\n'+n)}catch(e){st('');alert(e.message)}}

const rangeDays=(a,b)=>{const o=[];if(!a||!b||b<a)return o;for(let d=new Date(a+'T00:00');iso(d)<=b&&o.length<400;d.setDate(d.getDate()+1))o.push(iso(d));return o};
const lbl=(a,b)=>a.slice(0,7)==b.slice(0,7)?MONTHS[+a.slice(5,7)-1]:fmtD(a)+' – '+fmtD(b);
const rng=fn=>`<div class="g"><label>തുടക്കം<input type="date" value="${sel.from}" onchange="sel.from=this.value;${fn}()"></label><label>അവസാനം<input type="date" value="${sel.to}" onchange="sel.to=this.value;${fn}()"></label></div><p><button class="sm" onclick="mon(-1,'${fn}')">‹ മുൻ മാസം</button> <button class="sm" onclick="mon(0,'${fn}')">ഈ മാസം</button> <button class="sm" onclick="mon(1,'${fn}')">അടുത്ത മാസം ›</button></p>`;
function mon(d,fn){const b=d?new Date(sel.from+'T00:00'):new Date(),a=new Date(b.getFullYear(),b.getMonth()+d,1);sel.from=iso(a);sel.to=iso(new Date(a.getFullYear(),a.getMonth()+1,0));window[fn]()}

const isPortraitVar=v=>v=='_tc'||v=='_appf'||v=='_bon'||v=='_clslist';
const btns=(v,n)=>`<p><button class="pri" onclick="pr(window.${v},'${isPortraitVar(v)?'portrait':'landscape'}')">🖨️ പ്രിൻ്റ്</button> <button onclick="pdf('${v}','${n}')">⬇ PDF ഡൗൺലോഡ്</button> <button onclick="pdf('${v}','${n}',1)">☁ Drive-ലേക്ക്</button></p>`;
const regList=()=>db.students.filter(s=>sel.all||(s.joined>=sel.from&&s.joined<=sel.to));
const regF=()=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${sel.all?'checked':''} onchange="sel.all=this.checked;reg()"> എല്ലാ കുട്ടികളും (തീയതി ഫിൽട്ടർ ഇല്ലാതെ)</label>${sel.all?'':rng('reg')}`;

function pr(html, orient='landscape'){
  const p=$('#print');
  p.className=orient=='portrait'?'p-portrait':'p-landscape';
  p.innerHTML=html;
  window.print();
}

async function pdf(v,name,up){
  const html=window[v];
  if(!html)return alert('റിപ്പോർട്ട് ലോഡ് ആയിട്ടില്ല');
  const portrait=isPortraitVar(v);
  st('PDF തയ്യാറാക്കുന്നു…');
  const stage=$('#pdf_stage');
  stage.style.display='block';
  stage.innerHTML=`<div id="pdf_box" style="width:${portrait?'720px':'1080px'};margin:0 auto;background:#fff;color:#000;padding:8px;box-sizing:border-box">${html}</div>`;
  const box=$('#pdf_box');
  if(!portrait){
    box.querySelectorAll('table.reg-tbl').forEach(t=>{
      t.style.width='100%';
      t.style.tableLayout='auto';
      t.style.fontSize='8px';
    });
  }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const opt={
      margin:5,
      filename:name+'-'+fmtD(today)+'.pdf',
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},
      jsPDF:{unit:'mm',format:'a4',orientation:portrait?'portrait':'landscape'},
      pagebreak:{mode:['css','legacy'],after:'.tc-page-break'}
    };
    const w=html2pdf().set(opt).from(box);
    if(up){
      const d=await w.outputPdf('datauristring');
      await api('uploadPdf',{pin:PIN,name:name+(portrait?'-'+fmtD(today):'-'+fmtD(sel.from)+'_'+fmtD(sel.to))+'.pdf',b64:d.split(',')[1]});
      st('✓ Drive-ലേക്ക് അപ്‌ലോഡ് ചെയ്തു');
      alert('Drive › Madrasa_Backups › Reports ഫോൾഡറിൽ സേവ് ചെയ്തു');
    }else{
      await w.save();
      st('✓ PDF ഡൗൺലോഡ് ചെയ്തു');
    }
  }catch(e){
    st('⚠ PDF പരാജയം');
    alert('PDF പരാജയം: '+e.message);
  }finally{
    stage.style.display='none';
    stage.innerHTML='';
  }
}

/* അഡ്മിൻ */
const clsOn=(s,d)=>{const h=s.hist;if(!h||!h.length)return s.classId;let c=h[0].c;for(const e of h)if(e.from<=d)c=e.c;return c};
const inC=(s,c,a,b)=>clsOn(s,a)==c||clsOn(s,b)==c||(s.hist||[]).some(e=>e.c==c&&e.from>=a&&e.from<=b);
let sub={st:'apps',te:'mreg'};

function admin_(){
  const T=[['dash','🏠 ഡാഷ്ബോർഡ്'],['st','👦 വിദ്യാർത്ഥികൾ'],['te','👳 അധ്യാപകർ'],['set','⚙️ ക്രമീകരണം']];
  const S={
    st:[
      ['apps','അപേക്ഷകൾ ('+db.apps.length+')'],
      ['stu','കുട്ടികൾ'],
      ['tc','TC'],
      ['calls','വിളിക്കേണ്ട ലിസ്റ്റ്'],
      ['clsprint','ക്ലാസ് ലിസ്റ്റ്'],
      ['bonafide','പഠിക്കുന്നു സർട്ടിഫിക്കറ്റ്'],
      ['reg','അഡ്മിഷൻ രജിസ്റ്റർ'],
      ['attp','അറ്റൻഡൻസ് രജിസ്റ്റർ'],
      ['promo','പ്രൊമോഷൻ']
    ],
    te:[['mreg','മുഅല്ലിം രജിസ്റ്റർ'],['sig','സിഗ്നേച്ചർ രജിസ്റ്റർ']]
  };

  ({dash,apps,stu,tc:tcTab,calls:callsTab,clsprint:clsPrintTab,bonafide:bonafideTab,reg,attp,promo,mreg,sig,set})[S[tab]?sub[tab]:tab]();

function dash(){
  const t=today,pend=db.classes.map(c=>({c,p:pending(c.id)})).filter(x=>x.p.length);
  const lng=[];
  db.classes.forEach(c=>{
    const ks=Object.keys(db.att).filter(k=>k.startsWith(c.id+'|')&&!db.att[k].holiday).map(k=>k.split('|')[1]).sort().slice(-10);
    if(ks.length<10)return;
    stuIn(c.id).forEach(s=>{if(s.joined<=ks[0]&&ks.every(d=>db.att[c.id+'|'+d].absent.includes(s.no)))lng.push(s.no+'. '+s.name+' ('+c.name+')')});
  });
  const lngH=lng.length?'<h2>10 പ്രവൃത്തി ദിവസമായി വരാത്തവർ</h2><div class="card">'+lng.map(x=>'<div class="row">'+x+'</div>').join('')+'<p class="mu">വിടുതൽ ചെയ്യേണ്ടതുണ്ടോ എന്ന് നോക്കുക (കുട്ടികൾ ടാബ്).</p></div>':'';
  const rows=db.classes.map(c=>{const a=db.att[c.id+'|'+t],n=stuIn(c.id).length;return`<div class="row"><span>${esc(c.name)} · ${cls(c.id).sess=='1'?'സെക്ഷൻ 1':'സെക്ഷൻ 2'}</span><span>${a?a.holiday?'അവധി: '+esc(a.holiday):(n-a.absent.length)+' / '+n+' ഹാജർ':'<i class="mu">ഇന്ന് ബാക്കി</i>'}</span></div>`}).join('');
  $('#pg').innerHTML=`<div class="stat"><div><b>${db.students.filter(s=>!s.left).length}</b>ആകെ കുട്ടികൾ</div><div><b>${db.apps.length}</b>പുതിയ അപേക്ഷ</div><div><b>${pend.length}</b>ഹാജർ ബാക്കിയുള്ള ക്ലാസ്</div></div><h2>ഇന്ന് (${fmtD(t)})</h2><div class="card">${rows||'ക്ലാസുകളില്ല'}</div>${lngH}${pend.map(x=>`<p class="warn">${esc(x.c.name)}: ${x.p.length} ദിവസം ബാക്കി</p>`).join('')}`;
}

    .filter(s=>{

      return hay.includes(q);

    return `<div class="row" style="${s.left?'opacity:.65':''}">

function addStu(){
  if(!db.classes.length)return alert('ആദ്യം ക്രമീകരണത്തിൽ ക്ലാസ് ഉണ്ടാക്കുക');
  const no=+val('s_no');if(!val('s_name')||!no)return alert('പേരും നമ്പറും വേണം');
  if(db.students.some(s=>s.no==no))return alert('നമ്പർ ഉപയോഗത്തിലുണ്ട്');
  db.students.push({no,joined:val('s_j'),name:val('s_name'),house:val('s_house'),dob:val('s_dob'),parent:val('s_p'),prev:val('s_prev'),prevNo:val('s_pn'),guardian:val('s_gu'),phone:val('s_ph'),rel:val('s_rel'),job:val('s_job'),mark:val('s_mark'),classId:$('#s_cls').value});
  db.next=Math.max(db.next,no+1);save();stu();
}
function leave(no){
  const s=db.students.find(x=>x.no==no);if(!s)return;
  const h=(prompt('വിടുതൽ രീതി (നമ്പർ നൽകുക):\n1 = TC വാങ്ങി പോയി\n2 = TC വാങ്ങാതെ നിർത്തി\n3 = പഠനം പൂർത്തിയാക്കി')||'').trim();if(!h)return;
  const how={1:'TC വാങ്ങി',2:'TC വാങ്ങാതെ നിർത്തി',3:'പഠനം പൂർത്തിയാക്കി'}[h];if(!how)return alert('1, 2, 3 എന്നിവയിൽ ഒന്ന് നൽകുക');
  const d=prompt('വിട്ട തീയതി (YYYY-MM-DD). TC ഇല്ലാതെ നിർത്തിയവർക്ക് അവസാനം ഹാജരായ തീയതി നൽകാം',today);if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('തീയതി ശരിയല്ല');
  const r=prompt('കാരണം (ഇല്ലെങ്കിൽ ഒഴിവാക്കുക)')||'';
  let tcNo='',toMad='';
  if(h=='1'){
    tcNo=prompt('TC നമ്പർ')||'';
    toMad=prompt('ചേരുന്ന മദ്രസ (ഇല്ലെങ്കിൽ ഒഴിവാക്കുക)')||'';
  }
  s.left={date:d,cls:cls(s.classId).name,reason:r,how,tc:tcNo,to:toMad};
  save();
  if(h=='1')openTcForStu(no);else stu();
}

/* ---------- ഘട്ടം 2: വരാത്തവരെ വിളിക്കാനുള്ള ലിസ്റ്റ് ---------- */
function callsTab(){
  const cId=sel.callCls||db.classes[0]?.id||'';
  const attDates=Object.keys(db.att)
    .filter(k=>k.startsWith(cId+'|')&&!db.att[k].holiday)
    .map(k=>k.split('|')[1])
    .sort();
  const last5=attDates.slice(-5);
  const last10=attDates.slice(-10);

  const list=stuIn(cId).map(s=>{
    const abLast=last5.filter(d=>db.att[cId+'|'+d]&&(db.att[cId+'|'+d].absent||[]).includes(s.no)).length;
    const ab10=last10.length===10&&s.joined<=last10[0]&&last10.every(d=>(db.att[cId+'|'+d].absent||[]).includes(s.no));
    const latestRec=attDates.length?db.att[cId+'|'+attDates[attDates.length-1]]:null;
    const absLatest=latestRec&&(latestRec.absent||[]).includes(s.no);
    return {s,abLast,ab10,absLatest};
  }).filter(x=>x.abLast>0||x.ab10||x.absLatest);

  $('#pg').innerHTML=`<div class="card"><b>വരാത്തവരെ വിളിക്കാനുള്ള ലിസ്റ്റ്</b>

/* പ്രിൻ്റ് & രജിസ്റ്ററുകൾ */
function reg(){
  const H=['ക്രമ നമ്പർ','പ്രവേശന നമ്പർ','പേര്, ഇനീഷ്യൽ','വീട്ടുപേര്','പിതാവ്/മാതാവ്','രക്ഷിതാവ്, ഫോൺ','ബന്ധം','ജോലി, മേൽവിലാസം','ജനന തീയതി','ചേർന്ന ക്ലാസ്','ചേർന്ന തീയതി','അടയാളം','മുമ്പ് പഠിച്ച മദ്രസ/TC','മുൻ നമ്പർ','വിട്ട ക്ലാസ്','വിട്ട തീയതി','വിടാനുള്ള കാരണം','ചേരുന്ന മദ്രസ','കൊടുത്ത TC','സദറിൻ്റെ ഒപ്പ്','റിമാർക്സ്'];
  const L=regList().sort((a,b)=>a.no-b.no);
  const rows=L.map((s,idx)=>{
    const sSigCell=s.sadarSig?`<span class="sig-tilt"><img src="${s.sadarSig}" alt=""></span>`:'';
    return [idx+1,s.no,s.name,s.house,s.parent||'',(s.guardian||'')+' '+(s.phone||''),s.rel,s.job,fmtD(s.dob),cls((s.hist&&s.hist[0]||{c:s.classId}).c).name,fmtD(s.joined),s.mark,s.prev||'',s.prevNo||'',s.left?.cls||'',fmtD(s.left?.date||''),s.left?.reason||'',s.left?.to||'',s.left?.tc||'',sSigCell,s.left?(s.left.how||'വിടുതൽ ചെയ്തു'):''];
  });
  // കള്ളി നമ്പറുകൾ ഏറ്റവും മുകളിൽ കൊടുക്കുന്നു
  const numRow=`<tr>${H.map((_,i)=>`<th class="${i===0?'sn':''}" style="background:#f5f7f6">${i+1}</th>`).join('')}</tr>`;
  const titleRow=`<tr>${H.map((h,i)=>`<th class="${i===0?'sn':(i===7?'wrap-col':'')}">${h}</th>`).join('')}</tr>`;
  const thead=`<thead>${numRow}${titleRow}</thead>`;
  const tbl=`<div style="text-align:center;margin-bottom:6px"><b style="font-size:14px">ISLAMIC EDUCATIONAL BOARD</b><br><b>സമസ്ത കേരള സുന്നി വിദ്യാഭ്യാസ ബോർഡ്</b><br><b>വിദ്യാർത്ഥി പ്രവേശന രജിസ്റ്റർ (ADMISSION REGISTER)</b> ${db.madrasa?'– '+esc(db.madrasa):''}</div><table class="reg-tbl" style="width:100%">${thead}<tbody>${rows.map((r,ri)=>`<tr style="${L[ri].left?'opacity:.65;background:#f4f4f4':''}">${r.map((c,ci)=>`<td class="${ci===0?'sn':(ci===7?'wrap-col':'')}">${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  window._reg=tbl;
  $('#pg').innerHTML=`<p class="mu">തുടക്കത്തിൽ ക്രമ നമ്പറും ഏറ്റവും മുകളിൽ കള്ളി നമ്പറുകളും നൽകിയിട്ടുണ്ട്. ഏത് കള്ളിയിലും എഴുത്ത് താഴോട്ട് വലുപ്പം കൂടും; അടുത്ത കള്ളിയിലേക്ക് കയറില്ല.</p>${regF()}${btns('_reg','admission-register')}<div class="scroll card">${tbl}</div>`;
}

function attp(){
  const c=sel.cls,ms=sel.from,me=sel.to,days=rangeDays(ms,me),n=days.length,y=ms.slice(0,4);
  if(!n||n>31||!c){$('#pg').innerHTML=rng('attp')+'<p class="warn">1–31 ദിവസത്തെ തീയതി പരിധി തിരഞ്ഞെടുക്കുക.</p>';return}
  const sun=d=>new Date(d+'T00:00').getDay()==0,rec=d=>db.att[c+'|'+d];
  const stList=db.students.filter(s=>inC(s,c,ms,me)&&s.joined<=me&&(!s.left||s.left.date>=ms)).sort((a,b)=>a.no-b.no);
  const yrStartBound=db.yearStart||(y+'-01-01');
  const keys=Object.keys(db.att).filter(k=>k.startsWith(c+'|')).map(k=>k.split('|')[1]).filter(d=>d>=yrStartBound&&d<=me&&!db.att[c+'|'+d].holiday);
  const wM=keys.filter(d=>d>=ms&&d<=me).length,wP=keys.filter(d=>d<ms).length,wT=wM+wP;
  const pres=(s,fn)=>keys.filter(d=>fn(d)&&s.joined<=d&&clsOn(s,d)==c&&!db.att[c+'|'+d].absent.includes(s.no)).length;
  const pm=stList.map(s=>pres(s,d=>d>=ms&&d<=me)),pp=stList.map(s=>pres(s,d=>d<ms)),sum=a=>a.reduce((x,y)=>x+y,0),PM=sum(pm),PP=sum(pp),PT=PM+PP;
  const avg=(p,w)=>w?(p/w).toFixed(1):'-';
  const op=db.students.filter(s=>clsOn(s,ms)==c&&s.joined<ms&&(!s.left||s.left.date>=ms)).length,nw=db.students.filter(s=>clsOn(s,me)==c&&s.joined>=ms&&s.joined<=me).length,lf=db.students.filter(s=>s.classId==c&&s.left&&s.left.date>=ms&&s.left.date<=me).length;
  const N=n+7;
  const body=stList.map((s,i)=>`<tr><td class="sn">${i+1}</td><td>${s.no}</td><td style="text-align:left;min-width:75px">${esc(s.name)}</td>${days.map(d=>{const a=rec(d);return`<td style="${sun(d)||a?.holiday?'background:#ddd':''}">${sun(d)||!a||a.holiday||s.joined>d||clsOn(s,d)!=c?'':a.absent.includes(s.no)?'A':'×'}</td>`}).join('')}<td>${pm[i]}</td><td>${pp[i]}</td><td>${pm[i]+pp[i]}</td><td></td></tr>`).join('');
  const tot=days.map(d=>{const a=rec(d);return`<td>${a&&!a.holiday?stList.filter(s=>s.joined<=d&&clsOn(s,d)==c).length-a.absent.length:''}</td>`}).join('');
  const sg=days.map(d=>{const a=rec(d);return`<td class="sig-cell">${sgn(a)}</td>`}).join('');
  const tbl=`<table class="reg-tbl" style="width:100%"><thead><tr><td colspan="${N}" style="text-align:center;border:none"><b style="font-size:15px">ISLAMIC EDUCATIONAL BOARD</b><br>സമസ്ത കേരള സുന്നി വിദ്യാഭ്യാസ ബോർഡ്<br><b>സ്റ്റുഡൻ്റ്സ് അറ്റൻഡൻസ് രജിസ്റ്റർ (STUDENTS ATTENDANCE REGISTER)</b><div style="display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:6px"><span>മദ്രസ: ${esc(db.madrasa||'.........')}</span><span>നമ്പർ: ${esc(db.mno||'.........')}</span><span>ക്ലാസ്: ${esc(cls(c).name)}</span><span>${cls(c).sess=='1'?'സെക്ഷൻ 1':'സെക്ഷൻ 2'}</span><span>മാസം: ${lbl(ms,me)}</span><span>വർഷം: ${y}</span></div></td></tr><tr><th class="sn">ക്രമ നമ്പർ</th><th>പ്രവേശന നമ്പർ</th><th>പേര്</th>${days.map(d=>`<th>${+d.slice(8)}</th>`).join('')}<th>ഈ മാസം</th><th>മുൻ മാസം</th><th>ആകെ</th><th>റിമാർക്സ്</th></tr></thead><tbody>${body}<tr><td colspan="3">ആകെ ഹാജർ</td>${tot}<td>${wM}</td><td>${wP}</td><td>${wT}</td><td style="font-size:8px">പ്രവൃത്തി ദിവസം</td></tr><tr><td colspan="3">മുഅല്ലിമിൻ്റെ ഒപ്പ്</td>${sg}<td>${avg(PM,wM)}</td><td>${avg(PP,wP)}</td><td>${avg(PT,wT)}</td><td style="font-size:8px">ശരാശരി</td></tr></tbody><tfoot><tr><td colspan="${N}" style="text-align:left;border:none;padding-top:6px"><div style="margin-bottom:4px">മാസാരംഭത്തിൽ കുട്ടികൾ: <b>${op}</b> &nbsp;|&nbsp; പുതുതായി ചേർന്നവർ: <b>${nw}</b> &nbsp;|&nbsp; ഈ മാസം വിട്ടവർ: <b>${lf}</b> &nbsp;|&nbsp; മാസാവസാനത്തിൽ: <b>${op+nw-lf}</b></div><div style="display:flex;justify-content:space-between;margin-top:14px;font-size:11px"><span>ക്ലാസ് മുഅല്ലിം: ................</span><span>സദർ മുഅല്ലിം: ................</span><span>മുഫത്തീശ്: ................</span></div></td></tr></tfoot></table>`;
  window._att=tbl;
  $('#pg').innerHTML=`<div class="g"><label>ക്ലാസ്<select onchange="sel.cls=this.value;attp()">${opts(db.classes,c)}</select></label></div>${rng('attp')}<div></div><p class="mu">മദ്രസയുടെ പേരും നമ്പറും ക്രമീകരണത്തിൽ നൽകുക. ("മുൻ മാസം" ${esc(fmtD(yrStartBound))} മുതൽ കണക്കാക്കുന്നു)</p>${btns('_att','attendance-register')}<div class="scroll card">${tbl}</div>`;
}

/* മുഅല്ലിം രജിസ്റ്റർ */
const COURSES=['ഫൈനൽ','സെക്കൻഡറി','പ്രിലിമിനറി','ഹിസ്ബ്','ട്രെയിനിങ്','ITTC','ഹത്തുനസ്ഹ്','സമഗ്ര ട്രെയിനിങ്','ഇൻ സർവീസ്','പ്രത്യേക ബഹുമതി'];
function svc(t){if(!t.joined)return'';const a=new Date(t.joined),b=t.stop?new Date(t.stop):new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;m=Math.max(m,0);return Math.floor(m/12)+' വർഷം '+(m%12)+' മാസം'}
function mreg(){
  const t=window._et?db.teachers.find(x=>x.id==window._et):{},v=k=>t[k]||'';
  const H=['ക്രമ നമ്പർ','പേരും ഇനീഷ്യലും, വിലാസം','പിതാവിൻ്റെ പേര്','ജനന തീയതി','അടയാളം','രക്തഗ്രൂപ്പ്','ശമ്പളം','MSR നമ്പർ','ആകെ സർവീസ','നിയമന തീയതി, മതപരം, ഭൗതികം'];
  const H2=['സേവനം നിർത്തിയ തീയതി','CL അല്ലാത്ത ലീവ്','വിടാനുള്ള കാരണം','റിമാർക്സ്'];
  const rows=db.teachers.map((x,i)=>`<tr><td class="sn">${i+1}</td><td class="wrap-col">${esc(x.name||'')}</td><td>${esc(x.father||'')}</td><td>${esc(fmtD(x.dob||''))}</td><td>${esc(x.mark||'')}</td><td>${esc(x.blood||'')}</td><td>${esc(x.salary||'')}</td><td>${esc(x.msr||'')}</td><td>${svc(x)}</td><td>${esc(fmtD(x.joined||''))}<br>${esc(x.rel||'')}<br>${esc(x.mat||'')}</td>${COURSES.map((_,j)=>`<td>${esc((x.cr||[])[j]||'')}</td>`).join('')}<td>${esc(fmtD(x.stop||''))}</td><td>${esc(x.leaves||'')}</td><td>${esc(x.why||'')}</td><td>${esc(x.rem||'')}</td></tr>`).join('');
  const tbl=`<div style="text-align:center;margin-bottom:6px"><b style="font-size:14px">ISLAMIC EDUCATIONAL BOARD</b><br><b>സമസ്ത കേരള സുന്നി വിദ്യാഭ്യാസ ബോർഡ്</b><br><b>മുഅല്ലിം അഡ്മിഷൻ രജിസ്റ്റർ (MUALLIM ADMISSION REGISTER)</b> ${db.madrasa?'– '+esc(db.madrasa):''}</div><table class="reg-tbl" style="width:100%"><tr>${H.map((h,i)=>`<th rowspan="2" class="${i===0?'sn':''}">${i+1}<br>${h}</th>`).join('')}<th colspan="10">11. കോഴ്സുകൾ, സർട്ടിഫിക്കറ്റ് നമ്പർ</th>${H2.map((h,i)=>`<th rowspan="2">${12+i}<br>${h}</th>`).join('')}</tr><tr>${COURSES.map(c=>`<th>${c}</th>`).join('')}</tr>${rows}</table><p style="font-size:11px">സദർ മുഅല്ലിം: ........... മുഫത്തിഷ്: ...........</p>`;
  window._mr=tbl;
  $('#pg').innerHTML=`<div class="card"><b>${t.id?'തിരുത്തുക':'പുതിയ മുഅല്ലിമിനെ ചേർക്കുക'}</b>${f('m_n','പേരും ഇനീഷ്യലും, പൂർണ്ണ വിലാസം','text',esc(v('name')))}${f('m_f','പിതാവിൻ്റെ പേര്','text',esc(v('father')))}${f('m_d','ജനന തീയതി','date',v('dob'))}${f('m_b','രക്തഗ്രൂപ്പ്','text',esc(v('blood')))}${f('m_k','തിരിച്ചറിയാനുള്ള അടയാളം','text',esc(v('mark')))}${f('m_s','ശമ്പളം','number',v('salary'))}${f('m_m','MSR നമ്പർ','text',esc(v('msr')))}${f('m_j','മദ്രസയിലെ നിയമന തീയതി','date',v('joined'))}<div class="g">${f('m_r','വിദ്യാഭ്യാസ യോഗ്യത: മതപരം','text',esc(v('rel')))}${f('m_t','ഭൗതികം','text',esc(v('mat')))}</div><label>കോഴ്സ് സർട്ടിഫിക്കറ്റ് നമ്പർ (ഉള്ളത് മാത്രം)</label><div class="g">${COURSES.map((c,i)=>f('m_c'+i,c,'text',esc((t.cr||[])[i]||''))).join('')}</div>${f('m_x','സേവനം നിർത്തിയ തീയതി','date',v('stop'))}${f('m_l','CL അല്ലാത്ത മറ്റ് ലീവ്','text',esc(v('leaves')))}${f('m_w','വിടാനുള്ള കാരണം','text',esc(v('why')))}${f('m_e','റിമാർക്സ്','text',esc(v('rem')))}\n<label>ഒപ്പ് (വിരൽ കൊണ്ട് വരയ്ക്കുക)</label><canvas id="sgc" width="400" height="140" style="width:100%;border:1px solid var(--bd);border-radius:12px;background:#fff;touch-action:none"></canvas><button class="sm" onclick="clrSig()">ഒപ്പ് മായ്ക്കുക</button><p><button class="pri" onclick="saveM()">സേവ് ചെയ്യുക</button> ${t.id?'<button onclick="window._et=null;mreg()">റദ്ദാക്കുക</button>':''}</p></div>
<h2>മുഅല്ലിമുകൾ</h2>${db.teachers.map(x=>`<div class="row"><span>${esc(x.name)}<br><span class="mu">സർവീസ്: ${svc(x)||'-'}</span></span><button class="sm" onclick="window._et='${x.id}';mreg();scrollTo(0,0)">തിരുത്തുക</button></div>`).join('')}
${btns('_mr','muallim-register')}<div class="scroll card">${tbl}</div>`;
  initSig(t.sig);

function saveM(){
  if(!val('m_n'))return alert('പേര് നൽകുക');
  const o=window._et?db.teachers.find(x=>x.id==window._et):{id:'t'+Date.now()};
  Object.assign(o,{name:val('m_n'),father:val('m_f'),dob:val('m_d'),blood:val('m_b'),mark:val('m_k'),salary:val('m_s'),msr:val('m_m'),joined:val('m_j'),rel:val('m_r'),mat:val('m_t'),cr:COURSES.map((_,i)=>val('m_c'+i)),stop:val('m_x'),leaves:val('m_l'),why:val('m_w'),rem:val('m_e'),sig:sigData});
  if(!window._et)db.teachers.push(o);window._et=null;save();mreg();
}

function sig(){
  const ms=sel.from,me=sel.to,days=rangeDays(ms,me),n=days.length;
  if(!n||n>31){$('#pg').innerHTML=rng('sig')+'<p class="warn">1–31 ദിവസത്തെ തീയതി പരിധി തിരഞ്ഞെടുക്കുക.</p>';return}
  const sun=d=>new Date(d+'T00:00').getDay()==0;
  const yrStartBound=db.yearStart||(ms.slice(0,4)+'-01-01');
  const workingDays=days.filter(d=>!sun(d)&&db.classes.some(c=>{const a=db.att[c.id+'|'+d];return a&&!a.holiday}));
  const wCount=workingDays.length;
  const tPresentCount=t=>workingDays.filter(d=>db.classes.some(c=>{const a=db.att[c.id+'|'+d];return a&&!a.holiday&&a.by==t.id})).length;

  const cell=(t,d,s)=>{
    if(sun(d))return'<td style="background:#ddd"></td>';
    const done=db.classes.some(c=>{const a=db.att[c.id+'|'+d];return c.sess==s&&a&&a.by==t.id&&!a.holiday});
    if(!done)return'<td></td>';
    const inner=t.sig?`<img src="${t.sig}" alt="">`:`<i>${esc((t.name||'').slice(0,4))}</i>`;
    return`<td class="sig-cell"><span class="sig-tilt">${inner}</span></td>`;
  };
  const rows=db.teachers.map((t,i)=>[1,2].map(s=>`<tr>${s==1?`<td rowspan="2" class="sn">${i+1}</td><td rowspan="2" style="text-align:left;min-width:75px">${esc(t.name)}</td>`:''}${days.map(d=>cell(t,d,s)).join('')}${s==1?`<td rowspan="2">${wCount}</td><td rowspan="2">${tPresentCount(t)}</td>`:''}</tr>`).join('')).join('');
  const summaryRows=db.teachers.map((t,i)=>`<tr><td class="sn">${i+1}</td><td style="text-align:left">${esc(t.name)}</td><td>${wCount}</td><td>${tPresentCount(t)}</td></tr>`).join('');
  const summaryBox=`<div style="margin-top:10px"><b style="font-size:11px">അധ്യാപകരുടെ പ്രവർത്തി ദിവസങ്ങളും ഹാജരായ ദിവസങ്ങളും (${lbl(ms,me)} – വർഷാരംഭം: ${esc(fmtD(yrStartBound))})</b><table class="reg-tbl" style="width:100%;margin-top:4px;font-size:9px"><tr><th class="sn">ക്രമ നമ്പർ</th><th>അധ്യാപകന്റെ പേര്</th><th>പ്രവർത്തി ദിവസം</th><th>ഹാജരായ ദിവസം</th></tr>${summaryRows}</table></div>`;
  const tbl=`<div style="text-align:center;margin-bottom:6px"><b style="font-size:14px">ISLAMIC EDUCATIONAL BOARD</b><br><b>സമസ്ത കേരള സുന്നി വിദ്യാഭ്യാസ ബോർഡ്</b><br><b>മുഅല്ലിം സിഗ്നേച്ചർ രജിസ്റ്റർ (MUALLIM SIGNATURE REGISTER)</b> – ${esc(db.madrasa||'')} (${esc(db.mno||'')}) – ${lbl(ms,me)} ${ms.slice(0,4)}</div><table class="reg-tbl" style="width:100%"><tr><th class="sn">ക്രമ നമ്പർ</th><th>പേര്</th>${days.map(d=>`<th>${+d.slice(8)}</th>`).join('')}<th>പ്ര.ദി</th><th>ഹാജർ</th></tr>${rows}</table>${summaryBox}<p style="font-size:11px">സദർ മുഅല്ലിം: ........... മുഫത്തീശ്: ...........</p>`;
  window._sg=tbl;
  $('#pg').innerHTML=`${rng('sig')}<p class="mu">തുടക്കത്തിൽ ക്രമ നമ്പറും ഓരോ ദിവസവും രണ്ട് വരിയും (സെക്ഷൻ 1, 2) – ആകെ ${n} ദിവസം കാണാം. ഒപ്പുകൾ ചെരിച്ച് ക്രമീകരിച്ചിട്ടുണ്ട്.</p>${btns('_sg','signature-register')}<div class="scroll card">${tbl}</div>`;
}

async function trimOldAtt(){
  const cut=val('trim_dt');
  sel.trimBefore=cut;
  if(!cut||!/^\d{4}-\d{2}-\d{2}$/.test(cut))return alert('കൃത്യമായ തീയതി തിരഞ്ഞെടുക്കുക');
  if(!confirm(fmtD(cut)+' തീയതിക്ക് മുമ്പുള്ള ഹാജർ ഡാറ്റ ഒതുക്കട്ടെ? (മുമ്പ് ബാക്കപ്പ് എടുക്കും)'))return;
  st('പഴയ ഹാജർ ഒതുക്കുന്നു…');
  try{
    const res=await api('trimAttBefore',{pin:PIN,beforeDate:cut});
    Object.keys(db.att||{}).forEach(k=>{
      const d=k.split('|')[1]||'';
      if(d<cut)delete db.att[k];
    });
    st('✓ ഒതുക്കി: '+res.removed+' രേഖകൾ നീക്കി');
    alert('പൂർത്തിയായി! നീക്കിയ രേഖകൾ: '+res.removed+', ബാക്കിയുള്ളവ: '+res.kept);
    set();
  }catch(e){
    st('');
    alert('പരാജയം: '+e.message);
  }
}

function saveSettings(){
  const prevYs=db.yearStart||'';
  const newYs=val('m_ys');
  if(prevYs&&newYs&&prevYs!==newYs){
    if(!confirm('അധ്യായന വർഷാരംഭ തീയതി മാറ്റുകയാണ്! മുമ്പ് ഒരു ഡാറ്റാ ബാക്കപ്പ് എടുത്തിട്ടുണ്ടോ? തുടരട്ടെ?'))return;
  }
  db.madrasa=val('m_name');
  db.mno=val('m_no');
  db.next=+val('m_next')||1;
  db.yearStart=newYs;
  db.vacationStart=val('m_vs');
  db.sadarId=$('#m_sadar').value;
  if(db.madrasa)$('#ttl').textContent=db.madrasa+' (Gemini Phase 2)';
  save();
  alert('സേവ് ചെയ്തു');
}

<p class="mu">ടിക്ക് ഒഴിവാക്കിയവർ ഇപ്പോഴത്തെ ക്ലാസിൽ തന്നെ തുടരും. പ്രവേശന നമ്പർ മാറില്ല. പഴയ മാസങ്ങളിലെ രജിസ്റ്ററിൽ കുട്ടി പഴയ ക്ലാസിൽ തന്നെ കാണും.</p><p><button class="pri" onclick="doPromo('${c}')">തിരഞ്ഞെടുത്തവരെ മാറ്റുക</button></p></div>`;
}
function doPromo(c){
  const t=($('#pt')||{}).value,d=val('pd'),ks=[...document.querySelectorAll('.pk')].filter(x=>x.checked).map(x=>+x.value);
  if(!t)return alert('പുതിയ ക്ലാസ് തിരഞ്ഞെടുക്കുക');if(!d)return alert('തീയതി നൽകുക');if(!ks.length)return alert('ആരെയും തിരഞ്ഞെടുത്തിട്ടില്ല');
  if(!confirm('പ്രൊമോഷൻ നടത്തുന്നതിന് മുമ്പ് ബാക്കപ്പ് എടുത്തിട്ടുണ്ടെന്ന് ഉറപ്പാക്കുക!\n'+ks.length+' കുട്ടികളെ '+cls(c).name+' ൽ നിന്ന് '+cls(t).name+' ലേക്ക് മാറ്റട്ടെ?'))return;
  db.students.filter(s=>ks.includes(+s.no)).forEach(s=>{s.hist=s.hist&&s.hist.length?s.hist:[{c:s.classId,from:s.joined}];s.hist.push({c:t,from:d});s.classId=t});
  save();sel.pt='';promo();alert('മാറ്റി');
}
function readmit(no){const s=db.students.find(x=>x.no==no);if(!s||!confirm(s.name+' നെ പഴയ നമ്പറിൽ തന്നെ വീണ്ടും ചേർക്കട്ടെ?'))return;(s.leftHist=s.leftHist||[]).push(s.left);delete s.left;if(!db.classes.find(c=>c.id==s.classId)&&db.classes[0])s.classId=db.classes[0].id;save();stu()}

/* ---------- TC വിഭാഗം ---------- */
const MEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ORD=['','First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth','Ninth','Tenth','Eleventh','Twelfth','Thirteenth','Fourteenth','Fifteenth','Sixteenth','Seventeenth','Eighteenth','Nineteenth','Twentieth','Twenty First','Twenty Second','Twenty Third','Twenty Fourth','Twenty Fifth','Twenty Sixth','Twenty Seventh','Twenty Eighth','Twenty Ninth','Thirtieth','Thirty First'];
const ONES=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const numW=n=>n<20?ONES[n]:n<100?TENS[n/10|0]+(n%10?' '+ONES[n%10]:''):n<1000?ONES[n/100|0]+' Hundred'+(n%100?' '+numW(n%100):''):numW(n/1000|0)+' Thousand'+(n%1000?' '+numW(n%1000):'');
const dobW=d=>{if(!d)return'';const[y,m,dd]=d.split('-').map(Number);return ORD[dd]+' '+MEN[m-1]+' '+numW(y)};
function tcNext(yr){return Math.max(0,...db.students.map(s=>{const t=(s.tc&&s.tc.no)||(s.left&&s.left.tc)||'',m=/^(\d+)\/(\d{4})$/.exec(t);return m&&m[2]==yr?+m[1]:0}))+1}

function wd(s,a,b){
  let w=0,p=0,last='';
  const endBound=(db.vacationStart&&db.vacationStart<b)?db.vacationStart:b;
  Object.keys(db.att).sort().forEach(k=>{
    const[c,d]=k.split('|'),r=db.att[k];
    if(d<a||d>endBound||r.holiday||d<s.joined||clsOn(s,d)!=c)return;
    w++;
    if(!(r.absent||[]).includes(s.no)){p++;last=d}
  });
  return{w,p,last};
}

function openTcForStu(no){
  const s=db.students.find(x=>x.no==no);

}

  </div>
  <div class="card"><b>TC രജിസ്റ്റർ (കൊടുത്ത TC-കളുടെ ലിസ്റ്റ്)</b>
    ${issued.length?`<div class="scroll"><table class="reg-tbl" style="width:100%;margin-top:8px"><tr><th class="sn">ക്രമ നമ്പർ</th><th>TC നമ്പർ</th><th>തീയതി</th><th>കുട്ടി</th><th>ക്ലാസ്</th><th>ചേരുന്ന മദ്രസ</th><th>പ്രവർത്തി / ഹാജർ</th><th>നടപടി</th></tr>${issued.map((s,idx)=>{
      const t=s.tc||{};

    }).join('')}</table></div>`:'<p class="mu">ഇതുവരെ TC നൽകിയ കുട്ടികളില്ല.</p>'}
  </div>`;
}

function startTcSelected(){
  const no=+($('#tc_stu_sel')||{}).value;

  sel.tcStu=no;

  if(!s.left){
    if(!confirm(s.name+' നിലവിൽ ഈ ക്ലാസിലുണ്ട്. TC നൽകുന്നതിനായി കുട്ടിയെ "വിടുതൽ" (TC വാങ്ങി) ആയി രേഖപ്പെടുത്തട്ടെ?'))return;
    const d=prompt('വിട്ട തീയതി (YYYY-MM-DD)',today);if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('തീയതി ശരിയല്ല');
    const r=prompt('വിടാനുള്ള കാരണം (ഇല്ലെങ്കിൽ ഒഴിവാക്കുക)')||'';

    ['dobF','ജനന തീയതി (അക്കത്തിൽ)',fmtD(s.dob)],

    ['std','വിടുമ്പോൾ പഠിച്ച ക്ലാസ്',L.cls||cls(s.classId).name],
    ['admStd','ആ ക്ലാസിലേക്ക് പ്രവേശനം ലഭിച്ച തീയതി',fmtD(prom)],
    ['qual','കയറ്റത്തിന് അർഹതയുണ്ടോ?',''],

    ['app','സർട്ടിഫിക്കറ്റിന് അപേക്ഷിച്ച തീയതി',fmtD(today)],

function tcCalc(no){
  const s=db.students.find(x=>x.no==no);if(!s)return;
  const w=wd(s,$('#tc_ys').value,(s.left||{}).date||today);
  $('#tc_w15').value=w.w;$('#tc_w16').value=w.p;
}

function tcMake(no){
  const s=db.students.find(x=>x.no==no);if(!s)return;
  const T={no:val('tc_no'),issue:val('tc_issue'),ys:val('tc_ys'),guardSig:tcGuardSig,sadarSig:tcSadarSig};
  if(!T.no||!T.issue)return alert('TC നമ്പറും തീയതിയും വേണം');
  if(db.students.some(x=>x.no!=no&&((x.tc&&x.tc.no)||(x.left&&x.left.tc))==T.no&&T.issue.slice(0,4)==((x.tc&&x.tc.issue)||T.issue).slice(0,4)))return alert('ഈ TC നമ്പർ മറ്റൊരു കുട്ടിക്ക് നൽകിയിട്ടുണ്ട്');
  window._tcF.forEach(k=>T[k]=val('tc_'+k));
  s.tc=T;
  s.left=s.left||{};
  s.left.tc=T.no;
  if(T.to)s.left.to=T.to;
  if(/വാങ്ങാതെ/.test(s.left.how||''))s.left.how='TC വാങ്ങി';
  save();
  tcView(no);
}

function tcView(no){
  const s=db.students.find(x=>x.no==no);if(!s||!s.tc)return;
  window._tc=tcHtml(s.tc);
  $('#pg').innerHTML=`<p><button class="sm" onclick="tcForm(${no})">‹ തിരുത്താൻ</button> <button class="sm" onclick="tcTab()">TC ലിസ്റ്റ്</button></p>${btns('_tc','TC-'+no)}<div class="card">${window._tc}</div>`;
}

  const mk=[T.m1,T.m2].filter(Boolean).join(', ');
  const gSigImg=T.guardSig?`<img src="${T.guardSig}" style="height:40px;max-width:150px;display:block;margin-top:2px">`:'........................';
  const sSigImg=T.sadarSig?`<img src="${T.sadarSig}" style="height:40px;max-width:150px;display:inline-block;vertical-align:middle">`:'..............................';

  return `<style>

    .tcr{margin:5px 0}

function delC(id){if(db.students.some(s=>s.classId==id&&!s.left))return alert('ഈ ക്ലാസിൽ കുട്ടികളുണ്ട്. ആദ്യം അവരെ മറ്റ് ക്ലാസിലേക്ക് മാറ്റുക / വിടുതൽ ചെയ്യുക');if(confirm('ക്ലാസ് നീക്കട്ടെ?')){db.classes=db.classes.filter(c=>c.id!=id);save();set()}}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='madrasa-backup-'+fmtD(today)+'.json';a.click()}
function rs(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(db,JSON.parse(r.result));save();api('adminRestore',{pin:PIN,att:db.att||{},apps:db.apps||[]}).then(()=>{alert('റീസ്റ്റോർ ചെയ്തു');go()}).catch(e=>alert(e.message))}catch(e){alert('ഫയൽ ശരിയല്ല')}};r.readAsText(file)}
const sp=sessionStorage.getItem('madrasa_pin');if(sp)login(sp);
</script></body></html>
