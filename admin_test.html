<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ടെസ്റ്റ് പാനൽ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#eef3ef;--sf:#fff;--tx:#17251e;--mu:#58685f;--ac:#17694a;--ac2:#e1f0e8;--bd:#d3ddd6;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--sf:#1b2621;--tx:#e8efe9;--mu:#9bb0a4;--ac:#5fc79a;--ac2:#22372d;--bd:#33463c;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#121a16;--sf:#1b2621;--tx:#e8efe9;--mu:#9bb0a4;--ac:#5fc79a;--ac2:#22372d;--bd:#33463c;--rd:#ff8a80}
html,body{margin:0;font-size:16px;background:var(--bg);color:var(--tx);font-family:'Noto Sans Malayalam',system-ui,sans-serif;line-height:1.6}
body{padding:0 12px 40px;max-width:900px;margin:auto}
h1{font-size:21px;margin:0 -12px 8px;padding:18px 16px 16px;background:var(--ac);color:var(--bg);border-radius:0 0 22px 22px}h2{font-size:18px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border-radius:999px;padding:10px 16px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--sf);padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:600;min-height:44px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:4px 9px;font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);min-height:44px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:14px 6px;font-size:17px;border-bottom:1px solid var(--bd)}.row b{min-width:38px;text-align:center;padding:5px 0;border-radius:10px;background:var(--ac2);color:var(--ac)}.row.ab b{background:var(--rd);color:#fff}
.row.ab{color:var(--rd);font-weight:600;background:rgba(179,38,30,.08);border-radius:10px}
.mu{color:var(--mu);font-size:13px}.warn{color:var(--rd)}
.stat{display:flex;gap:8px;flex-wrap:wrap}.stat div{flex:1;min-width:90px;background:var(--ac2);padding:8px;border-radius:8px}.stat b{font-size:22px;display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px}th,td{border:1px solid #444;padding:3px 5px;text-align:center;vertical-align:top}
#print{display:none}
@media print{@page{size:A4 landscape;margin:6mm}html,body{padding:0!important;margin:0!important;max-width:none!important;background:#fff}body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;width:100%;box-sizing:border-box;padding:0 5mm;overflow:hidden}#print h3{margin:0 0 6px}#print table{width:100%!important;table-layout:fixed}#print td,#print th{overflow:hidden;word-break:break-word;padding:2px 1px}#print td[style*="nowrap"]{white-space:nowrap!important;text-overflow:ellipsis}#print table{font-size:9px}}
</style></head><body>
<h1 id="ttl">മദ്രസ മാനേജർ – അഡ്മിൻ</h1>
<div style="background:#b3261e;color:#fff;padding:10px 14px;border-radius:12px;margin:8px 0;font-weight:600">⚠ ഡ്യൂപ്ലിക്കേഷൻ ടെസ്റ്റ് പാനൽ – ഇതിൽ "എല്ലാ ഡാറ്റയും മായ്ക്കുക" ഉണ്ട്. ഇത് യഥാർത്ഥ Sheet-നെയും ബാധിക്കും.</div><div class="mu" id="sv"></div>
<div id="gate" class="card"><b>🔒 അഡ്മിൻ പ്രവേശനം</b><label>PIN / പാസ്‌വേഡ്<input id="pin" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><p><button class="pri" onclick="login()">പ്രവേശിക്കുക</button></p></div>
<div id="app" style="display:none"></div><div id="print"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxBzUzcsGppeWVO87RiHysygaAz-bCnf6r8JgKDGyw0zgvx1jnSnPOe404qK0YEFRpZVg/exec';
const $=s=>document.querySelector(s);
async function api(action,data){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,...data})});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j.data}
const MONTHS=['ജനുവരി','ഫെബ്രുവരി','മാർച്ച്','ഏപ്രിൽ','മേയ്','ജൂൺ','ജൂലൈ','ഓഗസ്റ്റ്','സെപ്റ്റംബർ','ഒക്ടോബർ','നവംബർ','ഡിസംബർ'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date());
const f=(id,l,t='text',v='')=>`<label>${l}<input id="${id}" type="${t}" value="${v}"></label>`;
const val=id=>$('#'+id).value.trim();
const opts=(arr,cur)=>arr.map(c=>`<option value="${c.id}" ${c.id==cur?'selected':''}>${c.name}</option>`).join('');
const cls=id=>db.classes.find(c=>c.id==id)||{name:'-'};
const stuIn=c=>db.students.filter(s=>s.classId==c&&!s.left).sort((a,b)=>a.no-b.no);
function tabs(list){return`<div class="tabs">`+list.map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';go()">${v}</button>`).join('')+`</div>`}
function pending(c){const days=Object.keys(db.att).filter(k=>k.startsWith(c+'|')).map(k=>k.split('|')[1]).sort();if(!days.length)return[];
const out=[];let d=new Date(days[days.length-1]+'T00:00');d.setDate(d.getDate()+1);while(iso(d)<today){if(d.getDay()!=0)out.push(iso(d));d.setDate(d.getDate()+1)}return out}
function sgn(a){if(!a)return'';if(a.holiday)return a.holiday;const t=db.teachers.find(x=>x.id==a.by)||{};return t.sig?`<img src="${t.sig}" style="height:20px;max-width:100%">`:(t.name||'').slice(0,6)}
let sigData='';
function initSig(d){sigData=d||'';const c=$('#sgc');if(!c)return;const x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#111';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
if(d){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=d}
let dr=false;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{dr=true;const[p,q]=pos(e);x.beginPath();x.moveTo(p,q);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!dr)return;const[p,q]=pos(e);x.lineTo(p,q);x.stroke()};
c.onpointerup=()=>{dr=false;sigData=c.toDataURL('image/png')}}
function clrSig(){initSig('')}

let PIN='',db={madrasa:'',mno:'',next:1,classes:[],teachers:[],students:[],apps:[],att:{}};
let tab='dash';
const sel={cls:null,date:today,from:today.slice(0,8)+'01',to:iso(new Date(+today.slice(0,4),+today.slice(5,7),0)),month:today.slice(0,7),all:true};
const st=t=>{$('#sv').textContent=t};
let saving=Promise.resolve();
function save(){const p={pin:PIN,data:{settings:{madrasa:db.madrasa,mno:db.mno,next:db.next},classes:db.classes,teachers:db.teachers,students:db.students}};
st('സേവ് ചെയ്യുന്നു…');saving=saving.then(()=>api('adminSave',p)).then(()=>st('✓ Google Sheet-ൽ സേവ് ചെയ്തു')).catch(e=>{st('⚠ സേവ് പരാജയം');alert('Sheet-ലേക്ക് സേവ് ചെയ്യാനായില്ല: '+e.message)})}
function delApp(id){api('delApp',{pin:PIN,id}).catch(e=>alert(e.message))}
async function login(p){p=p||$('#pin').value.trim();if(!p)return;st('ലോഡ് ചെയ്യുന്നു…');
try{Object.assign(db,await api('adminLoad',{pin:p}));PIN=p;sessionStorage.setItem('madrasa_pin',p)}catch(e){sessionStorage.removeItem('madrasa_pin');st('');return alert(e.message)}
if(!db.classes.length&&!db.students.length&&!db.teachers.length){db.classes=[{id:'c1',name:'ക്ലാസ് 1',sess:'1',teacher:''},{id:'c2',name:'ക്ലാസ് 2',sess:'2',teacher:''}];save()}
if(!db.classes.find(c=>c.id==sel.cls))sel.cls=db.classes[0]?.id;
$('#gate').style.display='none';$('#app').style.display='';if(db.madrasa)$('#ttl').textContent=db.madrasa;st('');go()}
const reload=()=>saving.then(()=>login(PIN));
function logout(){sessionStorage.removeItem('madrasa_pin');location.reload()}
function go(){admin_()}

async function clearAll(){if(prompt('Sheet-ലെ എല്ലാ ഡാറ്റയും മായ്ക്കും (മുമ്പ് Drive-ൽ ബാക്കപ്പ് എടുക്കും). തുടരാൻ CLEAR എന്ന് ടൈപ്പ് ചെയ്യുക')!=='CLEAR')return;st('മായ്ക്കുന്നു…');
try{const n=await api('clearAll',{pin:PIN,confirm:'CLEAR'});alert('എല്ലാം മായ്ച്ചു. ബാക്കപ്പ് Drive-ൽ: '+n);location.reload()}catch(e){st('');alert('പരാജയം: '+e.message)}}
async function chPin(){const n=prompt('പുതിയ PIN (4–32 അക്ഷരം)');if(!n)return;try{await api('setPin',{pin:PIN,newPin:n});PIN=n;sessionStorage.setItem('madrasa_pin',n);alert('PIN മാറ്റി')}catch(e){alert(e.message)}}
async function driveBk(){st('Drive-ലേക്ക് ബാക്കപ്പ് എടുക്കുന്നു…');try{const n=await api('driveBackup',{pin:PIN});st('✓ '+n);alert('Google Drive › Madrasa_Backups › Backups ഫോൾഡറിൽ സേവ് ചെയ്തു:\n'+n)}catch(e){st('');alert(e.message)}}
const rangeDays=(a,b)=>{const o=[];if(!a||!b||b<a)return o;for(let d=new Date(a+'T00:00');iso(d)<=b&&o.length<400;d.setDate(d.getDate()+1))o.push(iso(d));return o};
const lbl=(a,b)=>a.slice(0,7)==b.slice(0,7)?MONTHS[+a.slice(5,7)-1]:a+' – '+b;
const rng=fn=>`<div class="g"><label>തുടക്കം<input type="date" value="${sel.from}" onchange="sel.from=this.value;${fn}()"></label><label>അവസാനം<input type="date" value="${sel.to}" onchange="sel.to=this.value;${fn}()"></label></div><p><button class="sm" onclick="mon(-1,'${fn}')">‹ മുൻ മാസം</button> <button class="sm" onclick="mon(0,'${fn}')">ഈ മാസം</button> <button class="sm" onclick="mon(1,'${fn}')">അടുത്ത മാസം ›</button></p>`;
function mon(d,fn){const b=d?new Date(sel.from+'T00:00'):new Date(),a=new Date(b.getFullYear(),b.getMonth()+d,1);sel.from=iso(a);sel.to=iso(new Date(a.getFullYear(),a.getMonth()+1,0));window[fn]()}
const btns=(v,n)=>`<p><button class="pri" onclick="pr(window.${v})">🖨️ പ്രിൻ്റ്</button> <button onclick="pdf('${v}','${n}')">⬇ PDF ഡൗൺലോഡ്</button> <button onclick="pdf('${v}','${n}',1)">☁ Drive-ലേക്ക്</button></p>`;
const regList=()=>db.students.filter(s=>sel.all||(s.joined>=sel.from&&s.joined<=sel.to));
const regF=()=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${sel.all?'checked':''} onchange="sel.all=this.checked;reg()"> എല്ലാ കുട്ടികളും (തീയതി ഫിൽട്ടർ ഇല്ലാതെ)</label>${sel.all?'':rng('reg')}`;
async function pdf(v,name,up){const html=window[v];if(!html)return alert('രജിസ്റ്റർ ലോഡ് ആയിട്ടില്ല');st('PDF തയ്യാറാക്കുന്നു…');
const box=document.createElement('div');box.style.cssText='position:fixed;left:-20000px;top:0;width:'+(v=='_tc'?740:1090)+'px;background:#fff;color:#000;padding:6px';box.innerHTML=html;
box.querySelectorAll('table').forEach(t=>{t.style.width='100%';t.style.tableLayout='fixed';t.style.fontSize='9px'});document.body.appendChild(box);
try{const w=html2pdf().set({margin:5,filename:name+'-'+today+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:v=='_tc'?'portrait':'landscape'}}).from(box);
if(up){const d=await w.outputPdf('datauristring');await api('uploadPdf',{pin:PIN,name:name+(v=='_tc'?'-'+today:'-'+sel.from+'_'+sel.to)+'.pdf',b64:d.split(',')[1]});st('✓ Drive-ലേക്ക് അപ്‌ലോഡ് ചെയ്തു');alert('Drive › Madrasa_Backups › Reports ഫോൾഡറിൽ സേവ് ചെയ്തു')}
else{await w.save();st('✓ PDF ഡൗൺലോഡ് ചെയ്തു')}}catch(e){st('⚠ PDF പരാജയം');alert('PDF പരാജയം: '+e.message)}finally{box.remove()}}
/* അഡ്മിൻ */
const clsOn=(s,d)=>{const h=s.hist;if(!h||!h.length)return s.classId;let c=h[0].c;for(const e of h)if(e.from<=d)c=e.c;return c};
const inC=(s,c,a,b)=>clsOn(s,a)==c||clsOn(s,b)==c||(s.hist||[]).some(e=>e.c==c&&e.from>=a&&e.from<=b);
let sub={st:'apps',te:'mreg'};
function admin_(){const T=[['dash','🏠 ഡാഷ്ബോർഡ്'],['st','👦 വിദ്യാർത്ഥികൾ'],['te','👳 അധ്യാപകർ'],['set','⚙️ ക്രമീകരണം']];
const S={st:[['apps','അപേക്ഷകൾ ('+db.apps.length+')'],['stu','കുട്ടികൾ'],['reg','അഡ്മിഷൻ രജിസ്റ്റർ'],['attp','അറ്റൻഡൻസ് രജിസ്റ്റർ'],['promo','പ്രൊമോഷൻ']],te:[['mreg','മുഅല്ലിം രജിസ്റ്റർ'],['sig','സിഗ്നേച്ചർ രജിസ്റ്റർ']]};
$('#app').innerHTML='<p><button class="sm" onclick="reload()">🔄 പുതുക്കുക</button> <button class="sm" onclick="logout()">🔒 പുറത്തുകടക്കുക</button></p>'+tabs(T)+(S[tab]?'<div class="tabs">'+S[tab].map(([k,v])=>`<button class="sm ${sub[tab]==k?'on':''}" onclick="sub['${tab}']='${k}';go()">${v}</button>`).join('')+'</div>':'')+'<div id="pg"></div>';
({dash,apps,stu,reg,attp,promo,mreg,sig,set})[S[tab]?sub[tab]:tab]()}
function dash(){const t=today,pend=db.classes.map(c=>({c,p:pending(c.id)})).filter(x=>x.p.length);
const lng=[];db.classes.forEach(c=>{const ks=Object.keys(db.att).filter(k=>k.startsWith(c.id+'|')&&!db.att[k].holiday).map(k=>k.split('|')[1]).sort().slice(-10);if(ks.length<10)return;stuIn(c.id).forEach(s=>{if(s.joined<=ks[0]&&ks.every(d=>db.att[c.id+'|'+d].absent.includes(s.no)))lng.push(s.no+'. '+s.name+' ('+c.name+')')})});
const lngH=lng.length?'<h2>10 പ്രവൃത്തി ദിവസമായി വരാത്തവർ</h2><div class="card">'+lng.map(x=>'<div class="row">'+x+'</div>').join('')+'<p class="mu">വിടുതൽ ചെയ്യേണ്ടതുണ്ടോ എന്ന് നോക്കുക (കുട്ടികൾ ടാബ്).</p></div>':'';
const rows=db.classes.map(c=>{const a=db.att[c.id+'|'+t],n=stuIn(c.id).length;return`<div class="row"><span>${c.name} · ${cls(c.id).sess=='1'?'സെക്ഷൻ 1':'സെക്ഷൻ 2'}</span><span>${a?a.holiday?'അവധി: '+a.holiday:(n-a.absent.length)+' / '+n+' ഹാജർ':'<i class="mu">ഇന്ന് ബാക്കി</i>'}</span></div>`}).join('');
$('#pg').innerHTML=`<div class="stat"><div><b>${db.students.filter(s=>!s.left).length}</b>ആകെ കുട്ടികൾ</div><div><b>${db.apps.length}</b>പുതിയ അപേക്ഷ</div><div><b>${pend.length}</b>ഹാജർ ബാക്കിയുള്ള ക്ലാസ്</div></div><h2>ഇന്ന് (${t})</h2><div class="card">${rows||'ക്ലാസുകളില്ല'}</div>${lngH}${pend.map(x=>`<p class="warn">${x.c.name}: ${x.p.length} ദിവസം ബാക്കി</p>`).join('')}`}
function apps(){$('#pg').innerHTML=db.apps.length?db.apps.map(a=>`<div class="card"><b>${a.name}</b> (${a.gender}) · ${a.dob}<div class="mu">${a.guardian} · ${a.phone} · ${cls(a.classId).name} · അപേക്ഷ: ${a.date}</div>
<label>ചേർന്ന തീയതി<input type="date" id="j${a.id}" value="${a.date}"></label><label>ക്ലാസ്<select id="k${a.id}">${opts(db.classes,a.classId)}</select></label><label>പ്രവേശന നമ്പർ<input type="number" id="n${a.id}" value="${db.next}"></label>
<p><button class="pri sm" onclick="approve(${a.id})">അംഗീകരിക്കുക</button> <button class="sm" onclick="rej(${a.id})">നിരസിക്കുക</button></p></div>`).join(''):'<p class="mu">പുതിയ അപേക്ഷകളില്ല.</p>'}
function approve(id){if(!db.classes.length)return alert('ആദ്യം ക്ലാസ് ഉണ്ടാക്കുക');const a=db.apps.find(x=>x.id==id),no=+$('#n'+id).value;if(db.students.some(s=>s.no==no))return alert('ഈ പ്രവേശന നമ്പർ ഉപയോഗത്തിലുണ്ട്');
db.students.push({...a,no,joined:$('#j'+id).value,classId:$('#k'+id).value});db.next=Math.max(db.next,no+1);db.apps=db.apps.filter(x=>x.id!=id);delApp(id);save();admin_()}
function rej(id){if(confirm('നിരസിക്കട്ടെ?')){db.apps=db.apps.filter(x=>x.id!=id);delApp(id);save();admin_()}}
